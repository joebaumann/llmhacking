dataset_name: news
link_to_dataset: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/PQYF6M
data_type: News articles
data_description: |-
  A random sample of 1,606 articles newspaper articles on content moderation published from January 2020 to April 2021, drawn from a dataset of 980k articles collected via LexisNexis.
data_and_task_name: framesI_news
task_description: |-
  General frame detection: whether a news article contains a set of two opposing frames ("problem" and "solution"). The solution frame describes news articles framing content moderation as a solution to other issues (e.g., hate speech). The problem frame describes news articles framing content moderation as a problem on its own as well as to other issues (e.g., free speech).
bibtex_identifier: gilardi2023pnas
notes: \citet{gilardi2023pnas} refer to this as the 'Frames I' task for the 'News Articles (2020--2021)' dataset. We employ identical data preprocessing as \citet{gilardi2023pnas}, which means that we consider only news articles for which all annotators agree on the ground truth label and that are relevant according to the 'relevance_news' task. Additionally, we filter out duplicates.
ground_truth_annotators: Trained research assistants (political science students)
prompts: gilardi2023pnas,alizadeh2025open
nr_of_ground_truth_annotators: 2
nr_of_ground_truth_annotators_per_datapoint: 2
full_dataset_annotator_agreement: 0.7004