dataset_name: tweets17
link_to_dataset: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/PQYF6M
data_type: Tweets
data_description: |-
  A random sample of 1,856 tweets posted by members of the US Congress from 2017 to 2022, drawn from a dataset of 20 million tweets.
data_and_task_name: framesII_tweets17
task_description: |-
  Policy frame detection: whether a tweet contains a set of fourteen policy frames or other (i.e., 'Economy', 'Capacity and resources', 'Morality', 'Fairness and Equality', 'Constitutionality and Jurisprudence', 'Policy Prescription and Evaluation', 'Law and Order, Crime and Justice', 'Security and Defense', 'Health and Safety', 'Quality of Life', 'Cultural Identity', 'Public Opinion', 'Political', 'External Regulation and Reputation', or 'Other').
bibtex_identifier: gilardi2023pnas
notes: \citet{gilardi2023pnas} refer to this as the 'Frames II' task for the 'Tweets (2017--2023)' dataset. We employ identical data preprocessing as \citet{gilardi2023pnas}, which means that we consider only tweets for which all annotators agree on the ground truth label and that are relevant according to the 'relevance_tweets17' task. Additionally, we filter out duplicates.
ground_truth_annotators: Trained research assistants (political science students)
prompts: gilardi2023pnas,alizadeh2025open
nr_of_ground_truth_annotators: 2
nr_of_ground_truth_annotators_per_datapoint: 2
full_dataset_annotator_agreement: 0.3563