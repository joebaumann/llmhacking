dataset_name: tweets23
link_to_dataset: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/PQYF6M
data_type: Tweets
data_description: |-
  This dataset is similar to the tweets dataset, but for January 2023. It includes a random sample of 500 tweets (of which 339 were in English) drawn from a dataset of 1.3 million tweets.
data_and_task_name: relevance_tweets23
task_description: |-
  Binary annotation of whether a tweet is about content moderation (relevant/irrelevant).
bibtex_identifier: gilardi2023pnas
notes: \citet{gilardi2023pnas} refer to this as the 'Relevance' task for the 'Tweets (2023)' dataset. We employ identical data preprocessing as \citet{gilardi2023pnas}, which means that we consider only tweets for which all annotators agree on the ground truth label. Additionally, we filter out duplicates.
ground_truth_annotators: Trained research assistants (political science students)
prompts: gilardi2023pnas,alizadeh2025open
nr_of_ground_truth_annotators: 2
nr_of_ground_truth_annotators_per_datapoint: 2
full_dataset_annotator_agreement: 0.7121