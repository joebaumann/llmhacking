dataset_name: factuality
link_to_dataset: https://drive.google.com/drive/folders/1kFey69z8hGXScln01mVxrOhrqgM62X7I?usp=sharing
data_type: LLM outputs
data_description: |-
  LLM prompt-response pairs.
  The outputs were generated by three different models (InstructGPT~\citep{NEURIPS2022b1efde53}, ChatGPT\footnote{\url{https://chatgpt.com/}}, and search augmented PerplexityAI\footnote{\url{https://www.perplexity.ai/}}), using the prompt "Tell me a bio of <entity>", where entity corresponds to one of 183 people entities from Wikidata who have corresponding Wikipedia page (randomly sampled over 20 categories based on pageview frequency and nationality).
data_and_task_name: factuality
task_description: |-
  LLM responses that have been manually split into more than 16K individual facts, and each individual fact has been manually labeled as either supported, irrelevant, or not supported.
bibtex_identifier: min-etal-2023-factscore
prompts: min-etal-2023-factscore
ground_truth_annotators: Crowdworkers (fact-checking experts through Upwork)
nr_of_ground_truth_annotators: Not reported.
nr_of_ground_truth_annotators_per_datapoint: 1-2
full_dataset_annotator_agreement: 0.8329
full_dataset_annotator_agreement_estimated: True
full_dataset_annotator_agreement_notes: |-
  \citet{min-etal-2023-factscore} reported an annotator agreement of 91%, measured on 10% of the data (1,604 atomic facts) using two additional freelance annotators. Since the individual freelancer annotations were not available in the released dataset, we estimated Krippendorff's alpha as follows. We generated 10,000 synthetic annotation pairs with 91% agreement by sampling from the observed label distribution in the full dataset (Supported: 63.0%, Not-supported: 27.5%, Irrelevant: 9.4%) and randomly flipping 9% of labels to alternative classes to match the reported disagreement rate. This simulation yielded an estimated Krippendorff's alpha of 0.8329.