dataset_name: politeness_wiki
link_to_dataset: http://www.cs.cornell.edu/~cristian/Politeness_files/Stanford_politeness_corpus.zip
data_type: Wikipedia requests
data_description: |-
  Requests from Wikipedia editor's on user talk pages.
data_and_task_name: politeness_wiki
task_description: |-
  Indicate perceived politeness of wikipedia request.
bibtex_identifier: danescu-niculescu-mizil-etal-2013-computational
prompts: gligoric-etal-2025-unconfident,ziems-etal-2024-large
notes: Following~\citet{gligoric-etal-2025-unconfident}, we consider perceived politeness as a binary classification task and omit the neutral class. This reduces the number of datapoints from 4338 to 2171.
ground_truth_annotators: Amazon Mechanical Turk workers (US-based)
nr_of_ground_truth_annotators: 219
nr_of_ground_truth_annotators_per_datapoint: 5
annotator_agreement: 0.3827
full_dataset_annotator_agreement: 0.2403
full_dataset_annotator_agreement_notes: |-
 Krippendorff's alpha was calculated on the ternary classification task (polite/neutral/impolite) using all 5 annotators' scores.