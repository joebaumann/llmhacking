data_and_task_name: manifestos_econ_ideology
task_description: |-
  Classify sentences as left or right (for sentences on economic policy).
bibtex_identifier: benoit2016crowd
notes: We only include data where more than 80% of crowdworkers agree on the sentence being about economic policy. And we also only include data where more than 80% of crowdworkers agree on the binarized left ('very left' or 'somewhat left') vs. right ('very right' or 'somewhat right') label. Then, we use the crowd-worker majority-vote as the ground truth. We load the data from~\citep{benoit2016crowd} and~\citep{OrnsteinBlasingameTruscott2025}.
ground_truth_annotators: Crowd workers from 26 CrowdFlower channels
